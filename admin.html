<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomi.uz - Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #0f172a; margin-top: 0; }
        input, textarea, button { width: 100%; padding: 12px; margin-top: 10px; border: 1px solid #cbd5e1; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        textarea { height: 120px; resize: vertical; }
        button { background: #2563eb; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:disabled { background: #94a3b8; }
        .login-box { text-align: center; }
        .hidden { display: none; }
        .news-item { background: #f8fafc; padding: 12px; border-left: 4px solid #2563eb; margin-top: 10px; border-radius: 6px; }
        .delete-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; float: right; cursor: pointer; width: auto; margin: 0; }
    </style>
</head>
<body>

<div class="container">
    <!-- PAROL OYNASI -->
    <div id="loginSection" class="login-box">
        <h2>🔒 Pomi.uz Admin</h2>
        <input type="password" id="adminPass" placeholder="Parolni kiriting...">
        <button onclick="checkPass()">Kirish</button>
    </div>

    <!-- MAIN ADMIN PANEL -->
    <div id="adminContent" class="hidden">
        <h2>✍️ Yangi yangilik qo'shish</h2>
        <input type="text" id="title" placeholder="Yangilik sarlavhasi...">
        <input type="text" id="image" placeholder="Rasm URL havolasi...">
        <textarea id="text" placeholder="Yangilik matni..."></textarea>
        <button id="saveBtn" onclick="addNews()">Chop etish 🚀</button>

        <hr style="margin-top: 25px; border: 0; border-top: 1px solid #e2e8f0;">
        <h3>📋 Chop etilgan yangiliklar</h3>
        <div id="newsList">Yuklanmoqda...</div>
    </div>
</div>

<script>
    // Supabase Ulanish Sozlamalari
    const SUPABASE_URL = "https://dfxxgretrznyflbmgucw.supabase.co";
    const SUPABASE_KEY = "sb_publishable_kWxbevzzD9E7Cxue8g4Idg_c9-ipmsj";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const SECRET_KEY = "pomi2026"; // <<-- Admin parol (xohlasangiz o'zgartiring)

    function checkPass() {
        const pass = document.getElementById('adminPass').value;
        if(pass === SECRET_KEY) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('adminContent').classList.remove('hidden');
            loadAdminNews();
        } else {
            alert("Noto'g'ri parol!");
        }
    }

    async function addNews() {
        const title = document.getElementById('title').value;
        const image = document.getElementById('image').value;
        const text = document.getElementById('text').value;
        const btn = document.getElementById('saveBtn');

        if(!title || !text) {
            alert("Sarlavha va matnni to'ldiring!");
            return;
        }

        btn.disabled = true;
        btn.innerText = "Saqlanmoqda...";

        const { data, error } = await _supabase
            .from('news')
            .insert([
                { 
                    title: title, 
                    text: text, 
                    image: image || "https://via.placeholder.com/600x300?text=Pomi.uz" 
                }
            ]);

        btn.disabled = false;
        btn.innerText = "Chop etish 🚀";

        if (error) {
            alert("Xatolik yuz berdi: " + error.message);
        } else {
            alert("Yangilik muvaffaqiyatli chop etildi!");
            document.getElementById('title').value = '';
            document.getElementById('image').value = '';
            document.getElementById('text').value = '';
            loadAdminNews();
        }
    }

    async function loadAdminNews() {
        const listContainer = document.getElementById('newsList');
        
        let { data: news, error } = await _supabase
            .from('news')
            .select('*')
            .order('id', { ascending: false });

        if (error) {
            listContainer.innerHTML = "Xatolik: " + error.message;
            return;
        }

        if(news.length === 0) {
            listContainer.innerHTML = "<p>Hozircha yangiliklar yo'q.</p>";
            return;
        }

        listContainer.innerHTML = news.map(item => `
            <div class="news-item">
                <button class="delete-btn" onclick="deleteNews(${item.id})">O'chirish</button>
                <strong>${item.title}</strong>
            </div>
        `).join('');
    }

    async function deleteNews(id) {
        if(confirm("Haqiqatan ham o'chirmoqchimisiz?")) {
            const { error } = await _supabase.from('news').delete().eq('id', id);
            if(error) alert("Xatolik: " + error.message);
            else loadAdminNews();
        }
    }
</script>

</body>
</html>
