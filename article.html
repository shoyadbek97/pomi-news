<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomi.uz</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          paper: '#EAEDF0', paper2: '#DCE1E4',
          ink: '#0F172A', ink2: '#4B5567',
          signal: '#E23F26', amber: '#F2A93B', teal: '#146B5F',
          inkbg: '#0B111D', surfacedark: '#131B2B', borderdark: '#232D40',
        },
        fontFamily: {
          display: ['Fraunces', 'serif'],
          body: ['Inter', 'sans-serif'],
          mono: ['"IBM Plex Mono"', 'monospace'],
        },
      },
    },
  };
</script>
<style>
  ::selection { background: #E23F26; color: #fff; }
  .article-body p { margin-bottom: 1.25rem; line-height: 1.85; }
  .article-body p:last-child { margin-bottom: 0; }
</style>
</head>

<body class="bg-paper text-ink dark:bg-inkbg dark:text-paper font-body transition-colors duration-300 min-h-screen">

<!-- ===== HEADER ===== -->
<div class="border-b border-ink/10 dark:border-borderdark">
  <div class="max-w-3xl mx-auto px-4 md:px-6 h-14 flex items-center justify-between">
    <a href="/" class="font-display font-black text-2xl">POMI<span class="text-signal">.UZ</span></a>
    <div class="flex items-center gap-2">
      <a href="/" id="back-link" class="text-sm font-medium text-ink2 dark:text-paper2/70 hover:text-signal transition flex items-center gap-1">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        <span id="back-label">Orqaga</span>
      </a>
      <div class="relative">
        <button id="lang-toggle" aria-haspopup="true" aria-expanded="false" class="flex items-center gap-1.5 pl-2.5 pr-2 py-2 rounded-full hover:bg-ink/5 dark:hover:bg-white/10 transition text-xs font-semibold">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 010 20 15.3 15.3 0 010-20z"/></svg>
          <span id="lang-current-label">Lotin</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div id="lang-menu" class="hidden absolute right-0 mt-2 w-44 bg-white dark:bg-surfacedark border border-ink/10 dark:border-borderdark rounded-xl shadow-xl overflow-hidden z-50 text-sm text-ink dark:text-paper">
          <button data-lang="uz-latn" class="lang-option w-full text-left px-4 py-2.5 hover:bg-ink/5 dark:hover:bg-white/10 flex items-center gap-2.5"><span class="text-base leading-none">🇺🇿</span><span>O'zbekcha (lotin)</span></button>
          <button data-lang="uz-cyrl" class="lang-option w-full text-left px-4 py-2.5 hover:bg-ink/5 dark:hover:bg-white/10 flex items-center gap-2.5"><span class="text-base leading-none">🇺🇿</span><span>Ўзбекча (кирилл)</span></button>
          <button data-lang="ru" class="lang-option w-full text-left px-4 py-2.5 hover:bg-ink/5 dark:hover:bg-white/10 flex items-center gap-2.5"><span class="text-base leading-none">🇷🇺</span><span>Русский</span></button>
          <button data-lang="en" class="lang-option w-full text-left px-4 py-2.5 hover:bg-ink/5 dark:hover:bg-white/10 flex items-center gap-2.5"><span class="text-base leading-none">🇬🇧</span><span>English</span></button>
        </div>
      </div>
      <button id="theme-toggle" class="p-2 rounded-full hover:bg-ink/5 dark:hover:bg-white/10 transition">
        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- ===== ARTICLE ===== -->
<main class="max-w-3xl mx-auto px-4 md:px-6 py-8 md:py-12">

  <!-- Loading -->
  <div id="loader" class="text-center py-24">
    <div class="w-8 h-8 border-2 border-signal border-t-transparent rounded-full animate-spin mx-auto"></div>
    <p id="loading-text" class="text-sm text-ink2 dark:text-paper2/60 mt-3">Yuklanmoqda...</p>
  </div>

  <!-- Error -->
  <div id="error-view" class="hidden text-center py-24">
    <p id="error-title" class="font-display text-2xl mb-2">Yangilik topilmadi</p>
    <p id="error-desc" class="text-ink2 dark:text-paper2/60 text-sm mb-6">Bunday yangilik mavjud emas yoki o'chirilgan.</p>
    <a href="/" id="error-back" class="inline-block bg-signal text-white px-5 py-2.5 rounded-lg font-semibold hover:bg-ink transition">Bosh sahifaga qaytish</a>
  </div>

  <!-- Article content -->
  <article id="article-view" class="hidden">

    <!-- Category + meta -->
    <div class="flex items-center gap-2 mb-4">
      <span id="art-category" class="text-[11px] font-bold uppercase tracking-wider bg-signal text-white px-3 py-1 rounded-full"></span>
      <span class="text-xs font-mono text-ink2 dark:text-paper2/50" id="art-time"></span>
      <span class="flex items-center gap-1 text-xs font-mono text-ink2 dark:text-paper2/50">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
        <span id="art-views">0</span>
      </span>
    </div>

    <!-- Title -->
    <h1 id="art-title" class="font-display font-bold text-2xl md:text-4xl leading-tight mb-4"></h1>
    <p id="translating-note" class="hidden text-xs font-mono text-signal mb-3 flex items-center gap-1.5">
      <span class="w-3 h-3 border-2 border-signal border-t-transparent rounded-full animate-spin inline-block"></span>
      <span id="translating-note-text">Tarjima qilinmoqda...</span>
    </p>

    <!-- Excerpt -->
    <p id="art-excerpt" class="text-base md:text-lg text-ink2 dark:text-paper2/70 leading-relaxed mb-6 font-medium"></p>

    <!-- Author -->
    <div class="flex items-center gap-2 mb-6 pb-6 border-b border-ink/10 dark:border-borderdark">
      <div class="w-8 h-8 rounded-full bg-signal/10 flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-signal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <span id="art-author" class="text-sm font-medium"></span>
    </div>

    <!-- Hero image -->
    <img id="art-image" src="" alt="" class="w-full rounded-2xl object-cover max-h-[480px] mb-8 hidden">

    <!-- Full content -->
    <div id="art-content" class="article-body text-base md:text-lg leading-relaxed text-ink dark:text-paper/90"></div>

    <!-- Share -->
    <div class="mt-10 pt-6 border-t border-ink/10 dark:border-borderdark">
      <p id="share-label" class="text-sm font-semibold mb-3">Ulashish:</p>
      <div class="flex items-center gap-2 flex-wrap">
        <a id="share-telegram" href="#" target="_blank" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-[#229ED9] text-white text-sm font-medium hover:opacity-90 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.833.941z"/></svg>
          Telegram
        </a>
        <button id="share-copy" class="flex items-center gap-2 px-4 py-2 rounded-lg border border-ink/15 dark:border-borderdark text-sm font-medium hover:bg-ink/5 dark:hover:bg-white/10 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
          <span id="share-copy-label">Havola nusxalash</span>
        </button>
      </div>
    </div>

    <!-- Related articles -->
    <div class="mt-12">
      <h2 id="related-heading" class="font-display font-bold text-xl mb-4">Shuningdek o'qing</h2>
      <div id="related-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
    </div>

  </article>
</main>

<script>
  // ================= I18N (UI matnlari) =================
  const LANG_KEY = 'pomi_lang';
  const LANG_LABELS = { 'uz-latn': "Lotin", 'uz-cyrl': "Кирилл", 'ru': "RU", 'en': "EN" };
  const UI = {
    'uz-latn': { back: "Orqaga", loading: "Yuklanmoqda...", not_found: "Yangilik topilmadi",
      not_found_desc: "Bunday yangilik mavjud emas yoki o'chirilgan.", back_home: "Bosh sahifaga qaytish",
      editorial: "Tahririyat", share: "Ulashish:", copy_link: "Havola nusxalash", copied: "Nusxalandi ✓",
      also_read: "Shuningdek o'qing", translating: "Tarjima qilinmoqda...",
      just_now: "hozirgina", minutes_ago: n => `${n} daqiqa oldin`, hours_ago: n => `${n} soat oldin`, days_ago: n => `${n} kun oldin`,
      mln: " mln", ming: " ming" },
    'uz-cyrl': { back: "Орқага", loading: "Юкланмоқда...", not_found: "Янгилик топилмади",
      not_found_desc: "Бундай янгилик мавжуд эмас ёки ўчирилган.", back_home: "Бош саҳифага қайтиш",
      editorial: "Таҳририят", share: "Улашиш:", copy_link: "Ҳавола нусхалаш", copied: "Нусхаланди ✓",
      also_read: "Шунингдек ўқинг", translating: "Таржима қилинмоқда...",
      just_now: "ҳозиргина", minutes_ago: n => `${n} дақиқа олдин`, hours_ago: n => `${n} соат олдин`, days_ago: n => `${n} кун олдин`,
      mln: " млн", ming: " минг" },
    'ru': { back: "Назад", loading: "Загрузка...", not_found: "Новость не найдена",
      not_found_desc: "Такой новости не существует или она удалена.", back_home: "Вернуться на главную",
      editorial: "Редакция", share: "Поделиться:", copy_link: "Скопировать ссылку", copied: "Скопировано ✓",
      also_read: "Читайте также", translating: "Идёт перевод...",
      just_now: "только что", minutes_ago: n => `${n} мин. назад`, hours_ago: n => `${n} ч. назад`, days_ago: n => `${n} дн. назад`,
      mln: " млн", ming: " тыс." },
    'en': { back: "Back", loading: "Loading...", not_found: "Article not found",
      not_found_desc: "This article doesn't exist or has been removed.", back_home: "Return to homepage",
      editorial: "Editorial", share: "Share:", copy_link: "Copy link", copied: "Copied ✓",
      also_read: "Also read", translating: "Translating...",
      just_now: "just now", minutes_ago: n => `${n} min ago`, hours_ago: n => `${n}h ago`, days_ago: n => `${n}d ago`,
      mln: "M", ming: "K" },
  };
  let currentLang = localStorage.getItem(LANG_KEY) || 'uz-latn';
  if (!UI[currentLang]) currentLang = 'uz-latn';
  function tt(key, ...args) {
    const val = (UI[currentLang] && UI[currentLang][key] !== undefined) ? UI[currentLang][key] : UI['uz-latn'][key];
    return typeof val === 'function' ? val(...args) : val;
  }
  function applyStaticUI() {
    document.documentElement.lang = currentLang.startsWith('uz') ? 'uz' : currentLang;
    document.getElementById('lang-current-label').textContent = LANG_LABELS[currentLang];
    document.getElementById('back-label').textContent = tt('back');
    document.getElementById('loading-text').textContent = tt('loading');
    document.getElementById('error-title').textContent = tt('not_found');
    document.getElementById('error-desc').textContent = tt('not_found_desc');
    document.getElementById('error-back').textContent = tt('back_home');
    document.getElementById('share-label').textContent = tt('share');
    document.getElementById('share-copy-label').textContent = tt('copy_link');
    document.getElementById('related-heading').textContent = tt('also_read');
    document.getElementById('translating-note-text').textContent = tt('translating');
  }
  applyStaticUI();

  // Language dropdown
  const langToggle = document.getElementById('lang-toggle');
  const langMenu = document.getElementById('lang-menu');
  langToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    const isHidden = langMenu.classList.contains('hidden');
    langMenu.classList.toggle('hidden');
    langToggle.setAttribute('aria-expanded', isHidden ? 'true' : 'false');
  });
  document.addEventListener('click', (e) => {
    if (!langMenu.classList.contains('hidden') && !langMenu.contains(e.target) && e.target !== langToggle) {
      langMenu.classList.add('hidden');
    }
  });
  document.querySelectorAll('.lang-option').forEach(btn => {
    btn.addEventListener('click', () => {
      const lang = btn.dataset.lang;
      if (lang === currentLang) { langMenu.classList.add('hidden'); return; }
      localStorage.setItem(LANG_KEY, lang);
      window.location.reload();
    });
  });

  // ================= ON-DEMAND TARJIMA =================
  // Faqat ru/en uchun AI tarjima ishlatiladi; uz-latn/uz-cyrl matn asl holida qoladi.
  async function translateTexts(id, texts, lang) {
    const cacheKey = `pomi_trans_${id}_${lang}`;
    const cached = localStorage.getItem(cacheKey);
    if (cached) {
      try { return JSON.parse(cached); } catch { /* keshni tashlab yuboramiz */ }
    }
    try {
      const res = await fetch('/api/translate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ texts, targetLang: lang }),
      });
      if (!res.ok) throw new Error('translate api error');
      const { translations } = await res.json();
      if (translations && translations.length === texts.length) {
        localStorage.setItem(cacheKey, JSON.stringify(translations));
        return translations;
      }
    } catch (e) {
      console.error('Tarjima xatosi:', e);
    }
    return texts; // muvaffaqiyatsiz bo'lsa, asl matnni ko'rsatamiz
  }

  // Dark mode
  const html = document.documentElement;
  const setTheme = (dark) => {
    html.classList.toggle('dark', dark);
    document.getElementById('icon-sun').classList.toggle('hidden', dark);
    document.getElementById('icon-moon').classList.toggle('hidden', !dark);
  };
  setTheme(window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.getElementById('theme-toggle').addEventListener('click', () => setTheme(!html.classList.contains('dark')));

  // Helpers
  function timeAgo(dateStr) {
    const diff = Date.now() - new Date(dateStr).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return tt('just_now');
    if (mins < 60) return tt('minutes_ago', mins);
    const hours = Math.floor(mins / 60);
    if (hours < 24) return tt('hours_ago', hours);
    return tt('days_ago', Math.floor(hours / 24));
  }
  function formatViews(n) {
    if (!n) return '0';
    if (n >= 1000000) return (n/1000000).toFixed(1).replace('.0','') + tt('mln');
    if (n >= 1000) return (n/1000).toFixed(1).replace('.0','') + tt('ming');
    return n.toString();
  }

  // Load article
  const params = new URLSearchParams(location.search);
  const articleId = params.get('id');

  async function loadArticle() {
    if (!articleId) { showError(); return; }

    const { data, error } = await sb.from('articles').select('*').eq('id', articleId).single();
    if (error || !data) { showError(); return; }

    // Increment views
    await sb.rpc('increment_article_views', { article_id: Number(articleId) });

    // Agar til ru/en bo'lsa, avval tarjimani boshlaymiz (bir vaqtda related bilan)
    const needsTranslation = (currentLang === 'ru' || currentLang === 'en');
    let translatePromise = null;
    if (needsTranslation) {
      document.getElementById('translating-note').classList.remove('hidden');
      const toTranslate = [data.title, data.excerpt || '', data.content || ''];
      translatePromise = translateTexts(articleId, toTranslate, currentLang);
    }

    // Tarjima qilinmaydigan maydonlarni darhol to'ldiramiz
    document.getElementById('art-category').textContent = data.category;
    document.getElementById('art-time').textContent = timeAgo(data.created_at);
    document.getElementById('art-views').textContent = formatViews((data.views || 0) + 1);
    document.getElementById('art-author').textContent = data.author || tt('editorial');

    if (data.image_url) {
      const img = document.getElementById('art-image');
      img.src = data.image_url;
      img.alt = data.title;
      img.classList.remove('hidden');
    }

    let title = data.title, excerpt = data.excerpt || '', content = data.content || '';
    if (translatePromise) {
      const [tTitle, tExcerpt, tContent] = await translatePromise;
      title = tTitle || title;
      excerpt = tExcerpt || excerpt;
      content = tContent || content;
      document.getElementById('translating-note').classList.add('hidden');
    }

    document.title = title + ' — Pomi.uz';
    document.getElementById('art-title').textContent = title;
    if (excerpt) document.getElementById('art-excerpt').textContent = excerpt;
    if (content) {
      const contentEl = document.getElementById('art-content');
      const paragraphs = content.split('\n').filter(p => p.trim());
      contentEl.innerHTML = paragraphs.map(p => `<p>${p}</p>`).join('');
    }

    // Share buttons
    const url = encodeURIComponent(location.href);
    const titleParam = encodeURIComponent(title);
    document.getElementById('share-telegram').href = `https://t.me/share/url?url=${url}&text=${titleParam}`;
    document.getElementById('share-copy').addEventListener('click', () => {
      navigator.clipboard.writeText(location.href);
      const label = document.getElementById('share-copy-label');
      label.textContent = tt('copied');
      setTimeout(() => label.textContent = tt('copy_link'), 2000);
    });

    // Related articles
    const { data: related } = await sb.from('articles')
      .select('id, title, image_url, category, created_at')
      .eq('category', data.category)
      .neq('id', articleId)
      .order('created_at', { ascending: false })
      .limit(4);

    if (related && related.length) {
      let relatedTitles = related.map(r => r.title);
      if (needsTranslation) {
        relatedTitles = await translateTexts(`related_${data.category}`, relatedTitles, currentLang);
      }
      const relEl = document.getElementById('related-list');
      related.forEach((r, i) => {
        const card = document.createElement('a');
        card.href = `/article.html?id=${r.id}`;
        card.className = 'flex gap-3 rounded-xl border border-ink/10 dark:border-borderdark bg-white dark:bg-surfacedark p-3 hover:border-signal transition';
        card.innerHTML = `
          <img src="${r.image_url || `https://picsum.photos/seed/art${r.id}/120/90`}" alt="" class="w-20 h-16 rounded-lg object-cover shrink-0">
          <div class="min-w-0">
            <span class="text-[10px] font-bold uppercase tracking-wide text-signal">${r.category}</span>
            <p class="font-display font-semibold text-sm leading-snug mt-0.5 line-clamp-2">${relatedTitles[i] || r.title}</p>
            <span class="text-[11px] font-mono text-ink2 dark:text-paper2/50">${timeAgo(r.created_at)}</span>
          </div>
        `;
        relEl.appendChild(card);
      });
    } else {
      document.querySelector('.mt-12').classList.add('hidden');
    }

    document.getElementById('loader').classList.add('hidden');
    document.getElementById('article-view').classList.remove('hidden');
  }

  function showError() {
    document.getElementById('loader').classList.add('hidden');
    document.getElementById('error-view').classList.remove('hidden');
  }

  loadArticle();
</script>
</body>
</html>
